name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (no runtime deps in Phase 0)
        run: python -m pip install -e .

      # Phase 0: layout + import smoke test only. Integration smoke test with a
      # tiny model is added in Phase 1 (see docs/project-spec.md section 10).
      - name: Run tests
        run: python -m unittest discover -s tests -v
